appId: com.muse.desktop
productName: MUSE
asar: true
npmRebuild: false
publish:
  provider: github
  owner: hoangmaituan882-hue
  repo: muse
  releaseType: release
directories:
  output: release
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - portable
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  include: build/installer.nsh
  createDesktopShortcut: false
  createStartMenuShortcut: false
linux:
  target:
    - AppImage
