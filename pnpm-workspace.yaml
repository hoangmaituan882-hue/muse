packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  # toolchain
  "@playwright/test": ^1.64.1
  "@types/node": ^24.19.2
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

  # web
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.105.0
  "@tanstack/react-query-devtools": ^5.105.0
  "@tanstack/react-router": ^1.170.46
  "@tanstack/react-router-devtools": ^1.167.2
  "@tanstack/router-plugin": ^1.168.48
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  es-toolkit: ^1.53.0
  next-themes: ^0.4.6
  oxc-transform-react: ^0.156.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: ^4.3.3

  # ui
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/geist": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  lucide-react: ^1.62.0
  shadcn: ^4.23.0
  sonner: ^2.0.8
  tw-animate-css: ^1.4.0

  # api
  zod: ^4.6.7

  # mobile
  expo: 58.0.20
  expo-constants: ~58.0.13
  expo-linking: ~58.0.14
  expo-router: ~58.0.27
  expo-status-bar: ~58.0.4
  expo-system-ui: ~58.0.6
  react-native: 0.88.0
  react-native-gesture-handler: ~3.3.0
  react-native-reanimated: 4.7.1
  react-native-safe-area-context: ~5.10.1
  react-native-screens: ~4.30.0
  react-native-worklets: 0.13.0
  uniwind: ^1.13.0

  # desktop
  electron: ^45.1.0
  electron-builder: ^26.18.0
  expo-video: ~58.0.12
  electron-updater: ^6.8.11

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false
  electron: true
  electron-winstaller: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - "@expo/cli@58.1.16"
  - "@expo/fingerprint@0.21.7"
  - "@expo/metro-config@58.0.18"
  - "@expo/router-server@58.0.18"
  - "@shadcn/registry@0.2.1"
  - babel-preset-expo@58.0.21
  - electron@45.1.0
  - expo-file-system@58.0.12
  - expo-modules-cli@0.3.3
  - expo-modules-core@58.0.27
  - expo-modules-jsi@58.0.20
  - expo-router@58.0.27
  - expo@58.0.20
  - shadcn@4.23.0
